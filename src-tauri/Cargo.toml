[package]
name = "candle"
version = "0.2.2"
description = "Candle Toolkit - Android device management utility"
authors = ["Jzadl"]
edition = "2021"

[lib]
name = "candle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"

